# Main settings for the daily video machine.
# Change things here, not in the code.

channel:
  name: "Reality Shockwaves"      # your YouTube channel name, used in scripts
  niche: "technology and the future: AI, Elon Musk and his companies, gadgets, space, EVs, robots, science breakthroughs"
  language: "en"
  timezone: "America/New_York"    # the "day" of the plan is counted in this timezone
  stories_per_day: 5
  # Ordered list of today's jobs. Each GitHub run does the first unfinished one.
  job_order: ["short:0", "short:1", "long", "short:2", "short:3", "short:4"]
  avoid_repeat_days: 14           # don't pick a story we covered in the last N days

trends:
  max_age_hours: 36
  hacker_news: true
  google_trends_geo: "US"
  rss:
    - https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=en-US&gl=US&ceid=US:en
    - https://www.theverge.com/rss/index.xml
    - https://techcrunch.com/feed/
    - https://feeds.arstechnica.com/arstechnica/index
    - https://www.space.com/feeds/all
    - https://electrek.co/feed/
    - https://www.engadget.com/rss.xml
  reddit: []                     # Reddit blocks bots (HTTP 403), so it is off. Add subreddit names to try again.

llm:
  # Tried in order. If a model name stops existing, the next one is used.
  gemini_models: ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]
  groq_models: ["openai/gpt-oss-120b", "llama-3.3-70b-versatile"]
  vision_models: ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.8-flash", "gemini-3.7-flash"]  # checks clip previews (lite = higher free limits)
  temperature: 0.9
  fact_check: true                # second AI pass that checks the script against the sources

voice:
  # 1st choice: Gemini TTS (very natural). Tried in order; each model has its own small daily limit.
  gemini_models: ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]
  gemini_voice: "Charon"          # calm, trustworthy ("informative"). Others: Puck (upbeat), Gacrux (mature)
  # Keep this SHORT: Google warns long "director's notes" make the voice drift. The script follows a
  # "#### TRANSCRIPT" line, so the model reads only the script.
  style: "Style: calm, confident and warm, like explaining big news to a smart friend. Brisk, clear, natural."
  max_words_per_request: 240      # Gemini 3.8 can change voice mid-way on longer texts (known bug, Oct 2026)
  # Backup when Gemini's limit is used up
  kokoro_voice: "af_heart"
  target_wpm: {short: 160, long: 150}   # pro pace from research: Shorts 150-165, long videos ~150

short:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: [25, 45]
  cut_seconds: 2.4                # a new clip every ~2.4 s
  formats:                        # named series, rotated so videos don't all look the same
    - "WHAT IT MEANS FOR YOU: what happened in one line, then exactly how it changes the viewer's life, money or job"
    - "IS THIS REAL?: the claim or hype people are sharing, then what the facts actually say, then the verdict"
    - "FUTURE CHECK: what happened today, then what it could change in 5 years (clearly framed as a possibility)"
    - "3 THINGS TO KNOW: the news, then 3 short numbered points (use a list card), then why it matters"
    - "THE DETAIL EVERYONE MISSED: the headline everyone saw, then the overlooked detail that really matters"

long:
  width: 1920
  height: 1080
  fps: 30
  target_minutes: [6, 10]
  cut_seconds: 3.6

render:
  engine: "remotion"              # remotion = pro look (cards, animated captions). ffmpeg = simple backup
  finish_look: true               # light film grain + soft vignette on the final video

captions:
  whisper_model: "base.en"
  font: "Montserrat Black"        # caption font (assets/fonts). Big-channel "Hormozi" look
  hook_font: "Anton"              # first-frame hook text, chapter tags
  progress_bar: true              # bar across the top of Shorts that fills up
  # Color themes rotate by day. Colors are in RGB hex.
  themes:
    - {text: "FFFFFF", highlight: "FFE600", keyword: "39FF14"}
    - {text: "FFFFFF", highlight: "00E5FF", keyword: "FF3D7F"}
    - {text: "FFFFFF", highlight: "FF9F1C", keyword: "00E5FF"}

audio:
  music_dir: "assets/music"       # filled automatically from the list below (not stored in the repo)
  # Kevin MacLeod, incompetech.com, CC BY 4.0: free incl. commercial use, credit in every description.
  music_url: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/"
  music_tracks: ["Voxel Revolution", "Digital Lemonade", "Inspired", "EDM Detection Mode", "Hyperfun",
                 "Ouroboros", "Pamgaea", "Funk Game Loop", "Raving Energy"]
  music_credit: "Music: Kevin MacLeod (incompetech.com), licensed under CC BY 4.0 (creativecommons.org/licenses/by/4.0/)"
  music_under_voice_db: -26       # music level while words are spoken (voice sits ~18 dB above it)
  music_in_pauses_db: -17         # music comes up in pauses
  music_moods:                    # the writer picks a mood per story; tracks are chosen from that pool
    energetic: ["EDM Detection Mode", "Raving Energy", "Voxel Revolution"]
    upbeat: ["Digital Lemonade", "Pamgaea", "Funk Game Loop", "Hyperfun"]
    curious: ["Ouroboros", "Voxel Revolution", "Digital Lemonade"]
    inspiring: ["Inspired", "Ouroboros"]
  whoosh: true
  loudness_lufs: -14

upload:
  youtube:
    enabled: true
    privacy: "public"             # public | unlisted | private
    category_id: "28"             # Science & Technology
    post_question_comment: true   # posts the end question as a comment (pinning is not possible by API)
    ai_disclosure: false          # set true if you add realistic AI images of real people/events
  instagram:
    enabled: true
    graph_version: "v26.0"
    share_to_feed: true
  tiktok:
    enabled: true
    mode: "direct"                # direct = post right away | inbox = send as a draft to the TikTok app
    is_aigc: true                 # TikTok "AI-generated" label
