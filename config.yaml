# Main settings for the daily video machine.
# Change things here, not in the code.

channel:                          # settings shared by every channel
  name: "Factory"                 # only used when a channel has no name of its own
  language: "en"
  timezone: "America/New_York"    # the "day" of the plan is counted in this timezone (US audience)
  avoid_repeat_days: 365          # never repeat a topic a channel covered in the last N days

# One entry per YouTube channel. Each has its own topics, voice, music, look and daily amounts, so videos
# from different channels never share one template (YouTube's "materially varied" rule).
# Channel names are placeholders until the real channels are created.
channels:
  space:
    cards: "stat, compare, chart, map (where on Earth or in the sky)"
    name: "Space Channel"
    niche: "space and science: missions, discoveries, planets, stars, black holes, telescopes, how the universe works"
    style: "awe-filled but precise science explainer; every video tied to a real mission, discovery or paper"
    voice: {engine: gemini, gemini_voice: "Charon", on_limit: wait}
    music_moods: [inspiring, curious]
    look: {cardStyle: dark, captionY: 0.6, hookTilt: -2, highlight: "00E5FF", keyword: "FFE600"}
    long_per_day: 2
    shorts_per_day: 3
    post_hours: [11, 15, 18, 20, 21]          # US Eastern; long videos take the first slots
    category_id: "28"                         # Science & Technology
    secrets: SPACE                            # uses YT_REFRESH_TOKEN_SPACE (falls back to YT_REFRESH_TOKEN)
    topic_feeds:
      - https://www.space.com/feeds/all
      - https://www.nasa.gov/news-release/feed/
      - https://phys.org/rss-feed/space-news/
  history:
    cards: "map, timeline, quote (only real quotes), stat"
    name: "History Channel"
    niche: "history documentaries: empires, wars, inventions, lost cities, turning points, everyday life in the past"
    style: "calm documentary storyteller; vivid scenes, real dates and people, one surprising insight per chapter"
    voice: {engine: gemini, gemini_voice: "Gacrux", on_limit: wait}
    music_moods: [inspiring, curious]
    look: {cardStyle: light, captionY: 0.62, hookTilt: 1, highlight: "FF9F1C", keyword: "FFE600"}
    long_per_day: 2
    shorts_per_day: 3
    post_hours: [12, 16, 19, 20, 22]
    category_id: "27"                         # Education
    secrets: HISTORY
    on_this_day: true                         # use Wikipedia's "on this day" events as timely hooks
    topic_feeds: []
  business:
    cards: "chart, stat, compare, timeline"
    name: "Business Channel"
    niche: "business and company stories: how famous companies rose, failed or changed; founders, rivalries, strategy"
    style: "sharp business storyteller; concrete numbers, cause and effect, NEVER financial advice"
    voice: {engine: kokoro, kokoro_voice: "am_michael"}
    music_moods: [upbeat, energetic]
    look: {cardStyle: accent, captionY: 0.6, hookTilt: 0, highlight: "39FF14", keyword: "FFE600"}
    long_per_day: 1
    shorts_per_day: 2
    post_hours: [13, 17, 21]
    category_id: "27"
    secrets: BUSINESS
    topic_feeds:
      - https://feeds.arstechnica.com/arstechnica/business
      - https://techcrunch.com/category/startups/feed/
  geography:
    cards: "map (often), stat, compare, chart"
    name: "Geography Channel"
    niche: "geography and geopolitics explainers: why borders, cities, rivers, islands and countries are the way they are"
    style: "curious map explainer; maps and numbers, neutral and factual on politics, no sides taken"
    voice: {engine: kokoro, kokoro_voice: "bf_emma"}
    music_moods: [curious, inspiring]
    look: {cardStyle: dark, captionY: 0.58, hookTilt: 2, highlight: "FF3D7F", keyword: "00E5FF"}
    long_per_day: 1
    shorts_per_day: 1
    post_hours: [14, 20]
    category_id: "27"
    secrets: GEOGRAPHY
    topic_feeds: []

trends:
  max_age_hours: 36
  hacker_news: true
  google_trends_geo: "US"
  rss:
    - https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=en-US&gl=US&ceid=US:en
    - https://www.theverge.com/rss/index.xml
    - https://techcrunch.com/feed/
    - https://feeds.arstechnica.com/arstechnica/index
    - https://www.space.com/feeds/all
    - https://electrek.co/feed/
    - https://www.engadget.com/rss.xml
  reddit: []                     # Reddit blocks bots (HTTP 403), so it is off. Add subreddit names to try again.

llm:
  # Tried in order. If a model name stops existing, the next one is used.
  # Tried in this order. Each model has its OWN free daily limit, so more models = more free capacity.
  # gemini-3.8-flash writes best but has a tiny free quota; Groq's gpt-oss-120b is a strong free backup
  # (~1,000 requests/day, but only ~8K tokens per minute: the code waits a minute when that is hit).
  models: ["gemini:gemini-3.8-flash", "groq:openai/gpt-oss-120b", "gemini:gemini-3.7-flash",
           "gemini:gemini-3.6-flash", "gemini:gemini-3-flash-preview", "gemini:gemini-3.5-flash",
           "groq:qwen/qwen3.8-27b", "gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite",
           "groq:openai/gpt-oss-20b"]
  gemini_models: ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash"]   # only for the old news flow
  groq_models: ["openai/gpt-oss-120b"]
  vision_models: ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.6-flash", "gemini-3-flash-preview"]  # checks clip previews (lite = higher free limits)
  temperature: 0.9
  fact_check: true                # second AI pass that checks the script against the sources

voice:
  # 1st choice: Gemini TTS (very natural). Tried in order; each model has its own small daily limit.
  gemini_models: ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]
  gemini_voice: "Charon"          # calm, trustworthy ("informative"). Others: Puck (upbeat), Gacrux (mature)
  # Keep this SHORT: Google warns long "director's notes" make the voice drift. The script follows a
  # "#### TRANSCRIPT" line, so the model reads only the script.
  style: "Style: calm, confident and warm, like explaining big news to a smart friend. Brisk, clear, natural."
  max_words_per_request: 240      # Gemini 3.8 can change voice mid-way on longer texts (known bug, Oct 2026)
  # Backup when Gemini's limit is used up
  kokoro_voice: "af_heart"
  target_wpm: {short: 160, long: 150}   # pro pace from research: Shorts 150-165, long videos ~150

long_script:
  chapters: [7, 9]                # each chapter stands alone, so the best ones become Shorts
  chapter_words: [90, 140]        # about 35-55 seconds each (ideal Short length)
  total_words: [1100, 1600]       # about 8-10 minutes: 8+ minutes allows mid-video ads (more money)

short:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: [25, 45]
  cut_seconds: 2.4                # a new clip every ~2.4 s
  formats:                        # named series, rotated so videos don't all look the same
    - "WHAT IT MEANS FOR YOU: what happened in one line, then exactly how it changes the viewer's life, money or job"
    - "IS THIS REAL?: the claim or hype people are sharing, then what the facts actually say, then the verdict"
    - "FUTURE CHECK: what happened today, then what it could change in 5 years (clearly framed as a possibility)"
    - "3 THINGS TO KNOW: the news, then 3 short numbered points (use a list card), then why it matters"
    - "THE DETAIL EVERYONE MISSED: the headline everyone saw, then the overlooked detail that really matters"

long:
  width: 1920
  height: 1080
  fps: 25                         # 17% less drawing than 30, looks the same on YouTube (owner chose this)
  target_minutes: [6, 10]
  cut_seconds: 3.6

cleanup:
  keep_days: 2                    # delete rendered videos from the Mac 2 days after ALL of that day's uploads succeeded

render:
  engine: "remotion"              # remotion = pro look (cards, animated captions). ffmpeg = simple backup
  finish_look: true               # light film grain + soft vignette on the final video

captions:
  whisper_model: "base.en"
  font: "Montserrat Black"        # caption font (assets/fonts). Big-channel "Hormozi" look
  hook_font: "Anton"              # first-frame hook text, chapter tags
  progress_bar: true              # bar across the top of Shorts that fills up
  # Color themes rotate by day. Colors are in RGB hex.
  themes:
    - {text: "FFFFFF", highlight: "FFE600", keyword: "39FF14"}
    - {text: "FFFFFF", highlight: "00E5FF", keyword: "FF3D7F"}
    - {text: "FFFFFF", highlight: "FF9F1C", keyword: "00E5FF"}

audio:
  music_dir: "assets/music"       # filled automatically from the list below (not stored in the repo)
  # Kevin MacLeod, incompetech.com, CC BY 4.0: free incl. commercial use, credit in every description.
  music_url: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/"
  music_tracks: ["Voxel Revolution", "Digital Lemonade", "Inspired", "EDM Detection Mode", "Hyperfun",
                 "Ouroboros", "Pamgaea", "Funk Game Loop", "Raving Energy"]
  music_credit: "Music: Kevin MacLeod (incompetech.com), licensed under CC BY 4.0 (creativecommons.org/licenses/by/4.0/)"
  music_under_voice_db: -26       # music level while words are spoken (voice sits ~18 dB above it)
  music_in_pauses_db: -17         # music comes up in pauses
  music_moods:                    # the writer picks a mood per story; tracks are chosen from that pool
    energetic: ["EDM Detection Mode", "Raving Energy", "Voxel Revolution"]
    upbeat: ["Digital Lemonade", "Pamgaea", "Funk Game Loop", "Hyperfun"]
    curious: ["Ouroboros", "Voxel Revolution", "Digital Lemonade"]
    inspiring: ["Inspired", "Ouroboros"]
  whoosh: true
  loudness_lufs: -14

upload:
  youtube:
    enabled: true
    privacy: "public"             # public | unlisted | private
    category_id: "28"             # Science & Technology
    post_question_comment: true   # posts the end question as a comment (pinning is not possible by API)
    ai_disclosure: false          # set true if you add realistic AI images of real people/events
  instagram:
    enabled: true
    graph_version: "v26.0"
    share_to_feed: true
  tiktok:
    enabled: true
    mode: "direct"                # direct = post right away | inbox = send as a draft to the TikTok app
    is_aigc: true                 # TikTok "AI-generated" label
