name: Daily videos

on:
  schedule:
    # Times are UTC. In US Eastern summer time these are 7:00, 11:00, 12:30, 15:00, 18:00 and 21:00.
    # Each run makes and posts ONE video (the next unfinished job of the day), so posts are spread out.
    # GitHub often starts scheduled runs 5-30 minutes late. That is normal.
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "30 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "auto = next job, test = offline sample videos, plan = only write today's scripts, check = test all keys"
        default: auto
        type: choice
        options: [auto, test, plan, check]

permissions:
  contents: write

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Get background music from your private music repo (optional)
        # Music licences allow use in videos, not re-sharing the files, so tracks live in a PRIVATE repo
        # named <this repo>-music. Skipped if it or GH_PAT doesn't exist.
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: ${{ github.repository }}-music
          token: ${{ secrets.GH_PAT }}
          path: assets/music

      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Cache voice and caption models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and post video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CMD: ${{ github.event.inputs.command || 'auto' }}
        run: |
          case "$CMD" in auto|test|plan|check) ;; *) echo "unknown command"; exit 1 ;; esac
          if [ "$CMD" = "check" ]; then python scripts/check_setup.py; else python -m pipeline "$CMD"; fi

      - name: Save progress (also keeps the schedule alive)
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Progress $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push failed, trying again in 10 s"; sleep 10
          done
          echo "::error::Could not save progress to the repo"; exit 1

      - name: Keep the videos for 7 days (download them from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore
